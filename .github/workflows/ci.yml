name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Lint e testes (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.8 e o Python embutido no Kodi 21 para Windows
        python: ['3.8', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Ruff
        run: uv run --locked ruff check .
      - name: Pytest (organizador, utilitarios e todos os XML)
        run: uv run --locked pytest -v

  setup:
    name: Compilar e testar o Setup
    needs: testes
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Montar o pacote e compilar
        shell: pwsh
        run: ./instalador/montar.ps1
      - name: Instalar, conferir e desinstalar (pasta temporaria)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem instalador/saida/Ark-Setup-*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'ArkTeste'
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$dir`"",'/MERGETASKS="!desktopicon"' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup saiu com $($p.ExitCode)" }
          foreach ($f in 'Ark\Kodi\kodi.exe', 'Ark\Kodi\addons\skin.ark\addon.xml',
                         'Ark\Kodi\addons\plugin.video.ark\service.py',
                         'Ark\Kodi\addons\resource.language.pt_br\addon.xml',
                         'Ark\Kodi\portable_data\userdata\guisettings.xml',
                         'Ark\Kodi\portable_data\userdata\sources.xml',
                         'Ark\Kodi\portable_data\userdata\keymaps\ark-controle.xml',
                         'Desfazer organizacao.bat', 'Series', 'Filmes', 'unins000.exe') {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $f))) { throw "Faltou $f" }
          }
          $manifesto = Get-Content (Join-Path $dir 'Ark\Kodi\system\addon-manifest.xml') -Raw
          if ($manifesto -notmatch '<addon>skin.ark</addon>' -or $manifesto -notmatch '<addon>plugin.video.ark</addon>') {
            throw 'Addons do Ark fora do addon-manifest.xml: o Kodi os deixaria desativados'
          }
          $p = Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/APAGARDADOS=1' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Desinstalador saiu com $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path -LiteralPath (Join-Path $dir 'Ark')) { throw 'O desinstalador deixou a pasta Ark para tras' }
          if (-not (Test-Path -LiteralPath (Join-Path $dir 'Series'))) { throw 'O desinstalador apagou a pasta Series' }
          Write-Host 'Instalar -> conferir -> desinstalar: ok'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ark-Setup
          path: |
            instalador/saida/Ark-Setup-*.exe
            instalador/saida/Ark-Setup-*.exe.sha256
          if-no-files-found: error

  release:
    name: Publicar na Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Ark-Setup
          path: dist
      - name: Criar a Release com o Setup
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" dist/Ark-Setup-*.exe dist/Ark-Setup-*.exe.sha256
          --repo "$GITHUB_REPOSITORY" --title "Ark ${TAG#v}" --generate-notes --verify-tag
